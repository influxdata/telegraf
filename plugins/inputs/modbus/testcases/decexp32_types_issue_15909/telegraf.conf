[[inputs.modbus]]
  name_override = "modbus"
  name = "modbus"
  timeout = "1s"
  controller = "tcp://127.0.0.1:502"
  configuration_type = "request"
  exclude_register_type_tag = true
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    fields = [
      { address = 100, name = "signed",   type = "DECEXP32" },
      { address = 110, name = "unsigned", type = "UDECEXP32" },
      { address = 120, name = "scaled",   type = "DECEXP32", scale = 0.5 },
    ]
