# The test server returns the register address as value: 4660 is 0x1234.
[[inputs.modbus]]
  name_override = "modbus"
  name = "Device"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://127.0.0.1:502"
  holding_registers = [
    { name = "bcd16",   byte_order = "AB",   data_type = "BCD16", scale = 1.0, address = [4660] },
    { name = "bcd32",   byte_order = "ABCD", data_type = "BCD32", scale = 1.0, address = [9489, 9490] },
    { name = "scaled",  byte_order = "AB",   data_type = "BCD16", scale = 2.0, address = [291] },
    { name = "invalid", byte_order = "AB",   data_type = "BCD16", scale = 1.0, address = [171] },
  ]
