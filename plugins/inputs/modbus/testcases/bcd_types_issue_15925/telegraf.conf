# The test server returns the register address as value: 4660 is 0x1234.
[[inputs.modbus]]
  name_override = "modbus"
  name = "modbus"
  timeout = "1s"
  controller = "tcp://127.0.0.1:502"
  configuration_type = "request"
  exclude_register_type_tag = true
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    fields = [
      { address = 4660, name = "bcd16",   type = "BCD16" },
      { address = 9489, name = "bcd32",   type = "BCD32" },
      { address = 66,   name = "bcd64",   type = "BCD64" },
      { address = 291,  name = "scaled",  type = "BCD16", scale = 0.5 },
      { address = 171,  name = "invalid", type = "BCD16" },
    ]
