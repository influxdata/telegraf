[[inputs.modbus]]
  name_override = "modbus"
  name = "Device"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://127.0.0.1:502"
  holding_registers = [
    { name = "signed",   byte_order = "ABCD", data_type = "FLOAT_DEC_8E24M",  scale = 1.0, address = [100, 101] },
    { name = "unsigned", byte_order = "ABCD", data_type = "FLOAT_UDEC_8E24M", scale = 0.5, address = [110, 111] },
  ]
