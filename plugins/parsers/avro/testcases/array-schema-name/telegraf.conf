[[inputs.file]]
  files = ["./testcases/array-schema-name/message.json"]
  data_format = "avro"
  avro_format = "json"
  avro_schema = '''
{
  "type": "array",
  "items": {
    "type": "record",
    "namespace": "my.namespace",
    "name": "measurement",
    "fields": [
      {"name": "timestamp", "type": "long"},
      {"name": "value", "type": "double"}
    ]
  }
}
'''
  avro_timestamp = "timestamp"
  avro_timestamp_format = "unix"
